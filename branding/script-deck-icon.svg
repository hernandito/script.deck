<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- deep midnight-to-plum tile -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f3d"/>
      <stop offset=".55" stop-color="#2a1a4f"/>
      <stop offset="1" stop-color="#3d1440"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".75">
      <stop offset="0" stop-color="#7b6cff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#7b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".95" r=".6">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <!-- card faces -->
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd2ff"/>
      <stop offset="1" stop-color="#4b6bff"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b86bff"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#05040f" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#c2185b" flood-opacity=".35"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <!-- tile -->
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#glow2)"/>
    <rect width="512" height="256" fill="url(#sheen)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="115" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="3"/>

  <!-- the deck: three fanned cards -->
  <g transform="translate(262 268)">
    <g transform="rotate(-17) translate(-38 -12)" filter="url(#shadow)">
      <rect x="-104" y="-136" width="208" height="272" rx="34" fill="url(#cardBack)"/>
      <rect x="-104" y="-136" width="208" height="272" rx="34" fill="url(#sheen)"/>
    </g>
    <g transform="rotate(-5) translate(-8 -4)" filter="url(#shadow)">
      <rect x="-104" y="-136" width="208" height="272" rx="34" fill="url(#cardMid)"/>
      <rect x="-104" y="-136" width="208" height="272" rx="34" fill="url(#sheen)"/>
    </g>
    <g transform="rotate(8) translate(30 6)" filter="url(#shadow)">
      <rect x="-104" y="-136" width="208" height="272" rx="34" fill="url(#cardFront)"/>
      <!-- play mark with rounded corners -->
      <path d="M-28 -52 C-28 -66 -14 -74 -2 -67 L52 -26 C63 -18 63 -2 52 6 L-2 47 C-14 54 -28 46 -28 32 Z"
            fill="url(#play)" filter="url(#soft)" transform="translate(4 10)"/>
      <!-- two quiet "script lines" -->
      <rect x="-56" y="80" width="112" height="12" rx="6" fill="#2a1a4f" fill-opacity=".14"/>
      <rect x="-56" y="102" width="70" height="12" rx="6" fill="#2a1a4f" fill-opacity=".10"/>
    </g>
  </g>
</svg>
